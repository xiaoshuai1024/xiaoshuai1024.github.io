<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="720" height="460" fill="#ffffff"/>
  <!-- 标题 -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">改这个需求，走哪条路？</text>

  <!-- 起点 -->
  <rect x="290" y="60" width="140" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="87" text-anchor="middle" font-size="13" fill="#1e293b">一个改动需求</text>

  <!-- 判断1：跨子系统？ -->
  <line x1="360" y1="104" x2="360" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="360,130 280,175 360,220 440,175" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="172" text-anchor="middle" font-size="12" fill="#1e293b">跨子系统？</text>
  <text x="360" y="190" text-anchor="middle" font-size="11" fill="#64748b">website+backend / bff+e2e</text>

  <!-- 左：不跨 → 判断2 -->
  <line x1="280" y1="175" x2="170" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="225" y="167" text-anchor="middle" font-size="11" fill="#64748b">否</text>
  <polygon points="170,130 90,175 170,220 250,175" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="172" text-anchor="middle" font-size="12" fill="#1e293b">功能实现？</text>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#64748b">不只是修 bug</text>

  <!-- 判断2 否 → OpenSpec -->
  <line x1="90" y1="175" x2="55" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="73" y="167" text-anchor="middle" font-size="11" fill="#64748b">否</text>
  <rect x="20" y="245" width="120" height="60" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="80" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">OpenSpec</text>
  <text x="80" y="288" text-anchor="middle" font-size="10" fill="#1e293b">≤3 文件 / 单子系统</text>
  <text x="80" y="300" text-anchor="middle" font-size="10" fill="#1e293b">缺陷修复</text>
  <line x1="55" y1="175" x2="55" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="55" y1="225" x2="80" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="80" y1="225" x2="80" y2="245" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 判断2 是 → Superpowers -->
  <line x1="170" y1="130" x2="170" y2="105" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="185" y="120" font-size="11" fill="#64748b">是</text>
  <rect x="110" y="65" width="120" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="170" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">Superpowers</text>
  <text x="170" y="97" text-anchor="middle" font-size="10" fill="#1e293b">功能实现需门禁</text>

  <!-- 右：跨子系统 → Superpowers -->
  <line x1="440" y1="175" x2="555" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="498" y="167" text-anchor="middle" font-size="11" fill="#64748b">是</text>
  <line x1="555" y1="175" x2="555" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="555" y1="225" x2="580" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="580" y1="225" x2="580" y2="245" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="520" y="245" width="120" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="580" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">Superpowers</text>
  <text x="580" y="288" text-anchor="middle" font-size="10" fill="#1e293b">跨子系统门禁</text>
  <text x="580" y="300" text-anchor="middle" font-size="10" fill="#1e293b">讨论稿 → 定稿 → G1-G4</text>

  <!-- 本轮实战标注 -->
  <line x1="80" y1="305" x2="80" y2="340" stroke="#0f766e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="358" text-anchor="middle" font-size="11" fill="#0f766e">本轮 5 个 change</text>
  <text x="80" y="374" text-anchor="middle" font-size="10" fill="#64748b">engine 测试 / Java H2</text>
  <text x="80" y="388" text-anchor="middle" font-size="10" fill="#64748b">form 500 / ui alias / formId</text>

  <line x1="580" y1="305" x2="580" y2="340" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="580" y="358" text-anchor="middle" font-size="11" fill="#dc2626">本轮 1 个 plan</text>
  <text x="580" y="374" text-anchor="middle" font-size="10" fill="#64748b">website SSR 404 + merge</text>
  <text x="580" y="388" text-anchor="middle" font-size="10" fill="#64748b">跨 4 子系统</text>

  <!-- 底部总结 -->
  <rect x="40" y="410" width="640" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="432" text-anchor="middle" font-size="12" fill="#475569">流程重量匹配改动重量：单点修复走 OpenSpec（快），跨系统功能走 Superpowers（稳）</text>
</svg>
