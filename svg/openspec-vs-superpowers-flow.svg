<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">OpenSpec vs Superpowers：流程对比</text>

  <!-- 左列 OpenSpec -->
  <rect x="30" y="55" width="330" height="305" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="195" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">OpenSpec（轻量）</text>
  <text x="195" y="98" text-anchor="middle" font-size="11" fill="#475569">单子系统 / ≤3文件 / ≤5tasks</text>

  <rect x="50" y="115" width="290" height="34" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="195" y="136" text-anchor="middle" font-size="12" fill="#1e293b">① propose：proposal + design + tasks</text>

  <line x1="195" y1="149" x2="195" y2="165" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="195,165 190,160 200,160" fill="#0f766e"/>

  <rect x="50" y="170" width="290" height="34" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="195" y="191" text-anchor="middle" font-size="12" fill="#1e293b">② apply：改代码 + 跑测试验证</text>

  <line x1="195" y1="204" x2="195" y2="220" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="195,220 190,215 200,215" fill="#0f766e"/>

  <rect x="50" y="225" width="290" height="34" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="195" y="246" text-anchor="middle" font-size="12" fill="#1e293b">③ archive：归档闭环</text>

  <text x="195" y="290" text-anchor="middle" font-size="11" fill="#0f766e">单对话闭环 · 十分钟级</text>
  <text x="195" y="308" text-anchor="middle" font-size="10" fill="#64748b">本轮：engine测试/Java H2/form500</text>
  <text x="195" y="322" text-anchor="middle" font-size="10" fill="#64748b">ui alias / formId × 5 change</text>
  <text x="195" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">缺陷修复 / 小改</text>

  <!-- 右列 Superpowers -->
  <rect x="400" y="55" width="330" height="305" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="565" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Superpowers（重型）</text>
  <text x="565" y="98" text-anchor="middle" font-size="11" fill="#475569">跨子系统 / 功能实现 / 需门禁</text>

  <rect x="420" y="115" width="290" height="34" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="565" y="136" text-anchor="middle" font-size="12" fill="#1e293b">① 讨论稿：范围 + 待确认问题</text>

  <line x1="565" y1="149" x2="565" y2="165" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="565,165 560,160 570,160" fill="#dc2626"/>

  <rect x="420" y="170" width="290" height="34" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="565" y="191" text-anchor="middle" font-size="12" fill="#1e293b">② 定稿：§0-9 plan + taskGraph JSON</text>

  <line x1="565" y1="204" x2="565" y2="220" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="565,220 560,215 570,215" fill="#dc2626"/>

  <rect x="420" y="225" width="290" height="34" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="565" y="246" text-anchor="middle" font-size="12" fill="#1e293b">③ 实现：并行 subagent + G1-G4 门禁</text>

  <text x="565" y="290" text-anchor="middle" font-size="11" fill="#dc2626">多会话续跑 · /jx 接力</text>
  <text x="565" y="308" text-anchor="middle" font-size="10" fill="#64748b">本轮：website SSR 404 + merge 合并</text>
  <text x="565" y="322" text-anchor="middle" font-size="10" fill="#64748b">跨 website/bff/backend/e2e</text>
  <text x="565" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">功能实现 / 跨系统</text>

  <!-- 中间分隔 -->
  <line x1="380" y1="55" x2="380" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
</svg>
