<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="920" height="440" fill="#ffffff"/>
  <text x="460" y="40" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">117 个装机 skill 的淘汰漏斗</text>

  <!-- layer 1 -->
  <rect x="240" y="70" width="440" height="74" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="100" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">117 个已安装 skill</text>
  <text x="460" y="124" text-anchor="middle" font-size="12" fill="#475569">92 个第三方（Superpowers / ECC 框架带装）+ 25 个自研</text>

  <line x1="460" y1="144" x2="460" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="162" font-size="12" fill="#475569">第一筛：流程有没有点名</text>

  <!-- layer 2 -->
  <rect x="300" y="170" width="320" height="74" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="200" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">约 20 个进入候选</text>
  <text x="460" y="224" text-anchor="middle" font-size="12" fill="#475569">被 AGENTS.md 规范入口或 Makefile target 引用</text>

  <line x1="460" y1="244" x2="460" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="262" font-size="12" fill="#475569">第二筛：30 天内真实触发</text>

  <!-- layer 3 -->
  <rect x="360" y="270" width="200" height="74" rx="6" fill="#2563eb"/>
  <text x="460" y="300" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">20 个天天在跑</text>
  <text x="460" y="324" text-anchor="middle" font-size="12" fill="#dbeafe">12 个自研 + 8 个第三方（含 OpenSpec）</text>

  <!-- side note -->
  <rect x="60" y="280" width="240" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="180" y="302" text-anchor="middle" font-size="12" fill="#475569">其余 97 个：近 30 天</text>
  <text x="180" y="320" text-anchor="middle" font-size="12" fill="#475569">零次自动触发</text>

  <text x="460" y="400" text-anchor="middle" font-size="12" fill="#64748b">装机量是虚荣指标，触发率才是生产力指标</text>
</svg>
