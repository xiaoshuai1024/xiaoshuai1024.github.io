<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="ui-sans-serif,-apple-system,'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="400" fill="#ffffff"/>
  <text x="36" y="42" font-size="17" font-weight="700" fill="#1e293b">一次交付的五个阶段，每个阶段一张卡</text>
  <text x="36" y="66" font-size="12" fill="#64748b">换卡信号：上一张卡的产出被验收的那一刻</text>

  <!-- 卡1 开工 -->
  <g>
    <rect x="34" y="108" width="150" height="196" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="50" y="134" font-size="12" fill="#2563eb" font-weight="600">开工</text>
    <text x="50" y="158" font-size="14" font-weight="700" fill="#1e293b">开工卡</text>
    <text x="50" y="182" font-size="11.5" fill="#1e293b">复述现状</text>
    <text x="50" y="202" font-size="11.5" fill="#1e293b">列计划、列疑问</text>
    <text x="50" y="222" font-size="11.5" fill="#1e293b">确认后再动手</text>
    <line x1="50" y1="246" x2="168" y2="246" stroke="#e2e8f0"/>
    <text x="50" y="270" font-size="11" fill="#64748b">验收：计划被划改</text>
    <text x="50" y="286" font-size="11" fill="#64748b">后放行</text>
  </g>
  <!-- 卡2 契约 -->
  <g>
    <rect x="216" y="88" width="150" height="196" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="232" y="114" font-size="12" fill="#2563eb" font-weight="600">定案</text>
    <text x="232" y="138" font-size="14" font-weight="700" fill="#1e293b">契约卡</text>
    <text x="232" y="162" font-size="11.5" fill="#1e293b">需求写成 WHEN/THEN</text>
    <text x="232" y="182" font-size="11.5" fill="#1e293b">失败路径必答</text>
    <text x="232" y="202" font-size="11.5" fill="#1e293b">缺信息标 [待确认]</text>
    <line x1="232" y1="226" x2="350" y2="226" stroke="#e2e8f0"/>
    <text x="232" y="250" font-size="11" fill="#64748b">验收：边界场景</text>
    <text x="232" y="266" font-size="11" fill="#64748b">有答案</text>
  </g>
  <!-- 卡3 止损 -->
  <g>
    <rect x="398" y="116" width="150" height="196" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="414" y="142" font-size="12" fill="#2563eb" font-weight="600">执行</text>
    <text x="414" y="166" font-size="14" font-weight="700" fill="#1e293b">止损卡</text>
    <text x="414" y="190" font-size="11.5" fill="#1e293b">确认不了就停</text>
    <text x="414" y="210" font-size="11.5" fill="#1e293b">失败两次停止重试</text>
    <text x="414" y="230" font-size="11.5" fill="#1e293b">大段删除先申报</text>
    <line x1="414" y1="254" x2="532" y2="254" stroke="#e2e8f0"/>
    <text x="414" y="278" font-size="11" fill="#64748b">验收：无硬编</text>
    <text x="414" y="294" font-size="11" fill="#64748b">无死循环</text>
  </g>
  <!-- 卡4 验收 -->
  <g>
    <rect x="580" y="80" width="150" height="196" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="596" y="106" font-size="12" fill="#2563eb" font-weight="600">交付</text>
    <text x="596" y="130" font-size="14" font-weight="700" fill="#1e293b">验收卡</text>
    <text x="596" y="154" font-size="11.5" fill="#1e293b">贴构建/测试/lint 输出</text>
    <text x="596" y="174" font-size="11.5" fill="#1e293b">修不动就问</text>
    <text x="596" y="194" font-size="11.5" fill="#1e293b">不许改测试凑绿</text>
    <line x1="596" y1="218" x2="714" y2="218" stroke="#e2e8f0"/>
    <text x="596" y="242" font-size="11" fill="#64748b">验收：绿灯</text>
    <text x="596" y="258" font-size="11" fill="#64748b">带着证据</text>
  </g>
  <!-- 卡5 收尾 -->
  <g>
    <rect x="762" y="104" width="150" height="196" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="778" y="130" font-size="12" fill="#2563eb" font-weight="600">收尾</text>
    <text x="778" y="154" font-size="14" font-weight="700" fill="#1e293b">收尾卡</text>
    <text x="778" y="178" font-size="11.5" fill="#1e293b">结论压缩 5 条交接</text>
    <text x="778" y="198" font-size="11.5" fill="#1e293b">教训建议入库</text>
    <text x="778" y="218" font-size="11.5" fill="#1e293b">开新会话轻装走</text>
    <line x1="778" y1="242" x2="896" y2="242" stroke="#e2e8f0"/>
    <text x="778" y="266" font-size="11" fill="#64748b">验收：会话</text>
    <text x="778" y="282" font-size="11" fill="#64748b">可以安心关</text>
  </g>

  <!-- 换卡箭头（直角） -->
  <path d="M184,206 L200,206 L200,186 L212,186" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M366,186 L382,186 L382,214 L394,214" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M548,214 L564,214 L564,178 L576,178" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M730,178 L746,178 L746,202 L758,202" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 底注 -->
  <rect x="34" y="344" width="500" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="366" font-size="12" fill="#64748b">单文件小修、改错字、调样式：直接聊 + 一句绿灯汇报，不上卡组</text>
</svg>
