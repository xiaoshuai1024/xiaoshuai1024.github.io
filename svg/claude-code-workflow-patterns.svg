<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
  <rect width="700" height="480" fill="#ffffff"/>

  <text x="350" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Workflow 编排模式</text>

  <!-- ====== Pipeline ====== -->
  <text x="60" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">Pipeline（流水线）</text>
  <text x="60" y="82" font-family="sans-serif" font-size="11" fill="#94a3b8">步骤有依赖，按顺序执行</text>

  <!-- 阶段 A -->
  <rect x="60" y="98" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">定方案</text>
  <!-- 箭头 -->
  <line x1="180" y1="118" x2="210" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#blue)"/>
  <!-- 阶段 B -->
  <rect x="215" y="98" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="275" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">改后端</text>
  <!-- 箭头 -->
  <line x1="335" y1="118" x2="365" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#blue)"/>
  <!-- 阶段 C -->
  <rect x="370" y="98" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">改前端</text>

  <text x="60" y="165" font-family="sans-serif" font-size="11" fill="#64748b">墙钟 = ① + ② + ③</text>

  <!-- 分隔线 -->
  <line x1="20" y1="185" x2="680" y2="185" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ====== Parallel ====== -->
  <text x="60" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">Parallel（并行）</text>
  <text x="60" y="227" font-family="sans-serif" font-size="11" fill="#94a3b8">互相独立，同时执行</text>

  <rect x="60" y="243" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">查文档</text>

  <rect x="150" y="243" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">读代码</text>

  <rect x="240" y="243" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">看 Schema</text>

  <text x="60" y="308" font-family="sans-serif" font-size="11" fill="#64748b">墙钟 ≈ max(查文档, 读代码, 看 Schema)</text>

  <!-- 分隔线 -->
  <line x1="20" y1="328" x2="680" y2="328" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ====== Mixed ====== -->
  <text x="60" y="355" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">Mixed（混合编排）</text>
  <text x="60" y="372" font-family="sans-serif" font-size="11" fill="#94a3b8">第一阶段并行探路，第二阶段串行执行，第三阶段并行验证</text>

  <!-- Phase 1: Parallel -->
  <rect x="60" y="390" width="80" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="412" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309">P1 并行</text>

  <!-- arrow -->
  <line x1="140" y1="408" x2="165" y2="408" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#gray)"/>

  <!-- Phase 2: Pipeline -->
  <rect x="170" y="390" width="80" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="210" y="412" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb">P2 串行</text>

  <!-- arrow -->
  <line x1="250" y1="408" x2="275" y2="408" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#gray)"/>

  <!-- Phase 3: Parallel -->
  <rect x="280" y="390" width="80" height="36" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="320" y="412" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">P3 并行</text>

  <text x="60" y="450" font-family="sans-serif" font-size="11" fill="#64748b">典型：并行查资料 → 串行开发 → 并行测试+审查</text>

  <defs>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="gray" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
