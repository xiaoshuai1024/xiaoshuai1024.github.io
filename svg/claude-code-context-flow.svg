<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" width="720" height="650">
  <rect width="720" height="650" fill="#ffffff"/>

  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e293b">上下文管理决策流程</text>

  <!-- 起点 -->
  <rect x="260" y="55" width="200" height="40" rx="20" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">感觉模型开始变慢了？</text>

  <line x1="360" y1="95" x2="360" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>

  <!-- 第一步 -->
  <rect x="220" y="125" width="280" height="44" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="360" y="146" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1e293b">/context</text>
  <text x="360" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">先看各组件 Token 用量，别盲目清</text>

  <line x1="360" y1="169" x2="360" y2="199" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>

  <!-- 判断菱形 1 -->
  <polygon points="360,200 480,250 360,300 240,250" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="243" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">上下文接近</text>
  <text x="360" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">上限？</text>

  <!-- 否 → 继续 -->
  <line x1="480" y1="250" x2="560" y2="250" stroke="#22c55e" stroke-width="2" marker-end="url(#green)"/>
  <text x="520" y="235" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">否</text>
  <rect x="560" y="230" width="140" height="40" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="630" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#16a34a">可能只是</text>
  <text x="630" y="261" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#16a34a">模型波动</text>

  <!-- 是 → 分支 -->
  <line x1="360" y1="300" x2="360" y2="335" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>

  <!-- 分支判断菱形 2 -->
  <polygon points="360,335 460,390 360,445 260,390" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="383" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">会话里还有</text>
  <text x="360" y="399" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">重要上下文</text>
  <text x="360" y="415" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">不能丢？</text>

  <!-- 是 → /compact（左分支） -->
  <line x1="260" y1="390" x2="120" y2="390" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="195" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2563eb">是</text>
  <rect x="10" y="365" width="110" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="65" y="388" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#2563eb">/compact</text>
  <text x="65" y="405" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">压缩摘要保空间</text>

  <!-- 否 → 判断任务是否完成 -->
  <line x1="460" y1="390" x2="560" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>

  <!-- 任务完成判断菱形 3 -->
  <polygon points="560,345 650,390 560,435 470,390" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="383" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">当前任务</text>
  <text x="560" y="399" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">已做完？</text>

  <!-- 是 → /clear（向下） -->
  <line x1="560" y1="435" x2="560" y2="475" stroke="#22c55e" stroke-width="2" marker-end="url(#green)"/>
  <text x="575" y="460" text-anchor="start" font-family="sans-serif" font-size="11" fill="#16a34a">是</text>
  <rect x="490" y="475" width="140" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="498" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a">/clear</text>
  <text x="560" y="515" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">清空开启新任务</text>

  <!-- 否 → 先 /compact 顶着（向右） -->
  <line x1="650" y1="390" x2="670" y2="390" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="660" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f59e0b" font-weight="bold">否</text>
  <text x="655" y="410" font-family="sans-serif" font-size="11" fill="#f59e0b">↑ 还有任务没完</text>
  <text x="655" y="428" font-family="sans-serif" font-size="11" fill="#f59e0b">先 /compact 顶着</text>

  <!-- 底部总结 -->
  <rect x="40" y="565" width="640" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="583" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">总结</text>
  <text x="60" y="603" font-family="sans-serif" font-size="12" fill="#64748b">· 别等上下文崩了再救，定期跑 /context 监控用量</text>
  <text x="60" y="618" font-family="sans-serif" font-size="12" fill="#64748b">· 重要上下文没落盘 → /compact；任务完成 → /clear</text>

  <!-- 箭头 defs -->
  <defs>
    <marker id="gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
