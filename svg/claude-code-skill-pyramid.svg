<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <rect width="600" height="500" fill="#ffffff"/>

  <!-- 第三层：编排级（顶部） -->
  <rect x="175" y="40" width="250" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="75" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">编排级</text>
  <text x="300" y="103" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">Workflow / Agent 编排</text>

  <!-- 第二层：命令级（中部） -->
  <rect x="110" y="170" width="380" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">命令级</text>
  <text x="300" y="233" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">Subagent / Skill / Task</text>

  <!-- 第一层：对话级（底部） -->
  <rect x="45" y="300" width="510" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="335" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">对话级</text>
  <text x="300" y="363" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">提问 / 对话 / 简单任务</text>

  <!-- 箭头 -->
  <line x1="300" y1="390" x2="300" y2="445" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="315" y="433" text-anchor="start" font-family="sans-serif" font-size="13" fill="#2563eb">使用深度递进 → 效率指数级上升</text>

  <!-- 左侧比例标注 -->
  <line x1="35" y1="85" x2="35" y2="345" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="30" y="85" text-anchor="end" font-family="sans-serif" font-size="12" fill="#94a3b8">少</text>
  <text x="30" y="215" text-anchor="end" font-family="sans-serif" font-size="12" fill="#94a3b8">中</text>
  <text x="30" y="345" text-anchor="end" font-family="sans-serif" font-size="12" fill="#94a3b8">多</text>
  <text x="28" y="170" text-anchor="end" font-family="sans-serif" font-size="11" fill="#94a3b8">使用人数</text>
</svg>
