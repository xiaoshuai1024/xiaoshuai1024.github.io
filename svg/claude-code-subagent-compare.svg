<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <rect width="720" height="440" fill="#ffffff"/>

  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b">两种工作模式对比</text>

  <line x1="360" y1="42" x2="360" y2="400" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ====== 左侧：串行 ====== -->
  <text x="180" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">串行（传统方式）</text>

  <rect x="80" y="90" width="200" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">查 API 文档</text>

  <line x1="180" y1="134" x2="180" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#gray)"/>

  <rect x="80" y="158" width="200" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">扫代码库</text>

  <line x1="180" y1="202" x2="180" y2="222" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#gray)"/>

  <rect x="80" y="226" width="200" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">查数据库 Schema</text>

  <rect x="80" y="295" width="200" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="180" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">总时间 = A + B + C</text>

  <text x="180" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">每步等上一步完成</text>

  <!-- ====== 右侧：并行 ====== -->
  <text x="540" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">并行（Subagent）</text>

  <rect x="460" y="90" width="160" height="36" rx="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="540" y="113" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">主会话（你）</text>

  <!-- 分叉路径 -->
  <path d="M 460 108 L 420 108 L 420 148" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#blue)"/>
  <path d="M 540 126 L 540 148" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#blue)"/>
  <path d="M 620 108 L 660 108 L 660 148" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#blue)"/>

  <rect x="370" y="152" width="100" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="420" y="169" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Subagent A</text>
  <text x="420" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">查 API 文档</text>

  <rect x="490" y="152" width="100" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="169" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Subagent B</text>
  <text x="540" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">扫代码库</text>

  <rect x="610" y="152" width="100" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="660" y="169" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Subagent C</text>
  <text x="660" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">查 Schema</text>

  <!-- 收集路径 -->
  <path d="M 420 196 L 420 230 L 540 250" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M 540 196 L 540 250" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#blue)"/>
  <path d="M 660 196 L 660 230 L 540 250" stroke="#2563eb" stroke-width="1.5" fill="none"/>

  <rect x="490" y="254" width="100" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="277" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b">你合并决策</text>

  <rect x="370" y="295" width="200" height="22" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="470" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">总时间 ≈ max(A, B, C)</text>

  <text x="470" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">三个 Subagent 同时跑</text>

  <defs>
    <marker id="gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
